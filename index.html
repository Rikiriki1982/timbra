<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#4f46e5"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><title>Presenze & Ticket Pro</title>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#1a2233;--mu:#6a7589;--ac:#4f46e5;--bd:#e2e7f1;--ok:#16a34a;--er:#dc2626;--wa:#d97706;--fe:#0284c7;--ma:#e11d48;--pe:#9333ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--card:#172033;--tx:#e8edf7;--mu:#94a1b6;--bd:#26324a}}
:root[data-theme="dark"]{--bg:#0e1320;--card:#172033;--tx:#e8edf7;--mu:#94a1b6;--bd:#26324a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:84px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#4f46e5,#0ea5e9);color:#fff}
header h1{margin:0;font-size:18px}.hl{display:flex;align-items:center;gap:10px;min-width:0}#logo{height:40px;max-width:96px;object-fit:contain;background:#fff;border-radius:9px;padding:3px;flex:none}#logo[hidden]{display:none}header small{opacity:.9;display:block}
.badge{background:rgba(255,255,255,.25);padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;overflow-x:auto}
.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.end{justify-content:flex-end}.sp{justify-content:space-between}
.clk{font-size:44px;font-weight:700;letter-spacing:1px}
.stat{flex:1;min-width:90px;background:var(--bg);border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;background:var(--ac);color:#fff;cursor:pointer}
.btn.ok{background:var(--ok)}.btn.er{background:var(--er)}.btn.gh{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}.pbig{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}.pbig .btn{flex:1;min-width:150px;padding:16px 14px;font-size:17px}
.hero .row{margin-top:12px}.hero .btn{flex:1}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 2px;font-size:11px;cursor:pointer;position:relative}
nav button span{display:block;font-size:20px}nav button.on{color:var(--ac);font-weight:700}
nav i{position:absolute;top:2px;right:18%;background:var(--er);color:#fff;border-radius:99px;font-size:10px;padding:0 5px;font-style:normal}
h2{font-size:17px;margin:4px 0 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal b{text-align:center;font-size:12px;color:var(--mu)}
.cell{min-height:64px;border:1px solid var(--bd);border-radius:10px;padding:3px;font-size:12px;cursor:pointer;overflow:hidden}
.cell.on{outline:2px solid var(--ac)}.cell.today span{background:var(--ac);color:#fff;border-radius:99px;padding:0 6px}
.cell em{display:block;font-style:normal;font-size:10px;border-radius:5px;padding:0 3px;margin-top:2px;color:#fff;background:var(--ok);white-space:nowrap;overflow:hidden}
em.ferie{background:var(--fe)!important}em.malattia{background:var(--ma)!important}em.permesso{background:var(--pe)!important}em.tk{background:var(--wa)!important}em.pn{opacity:.55;outline:1px dashed #fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;color:#fff;background:var(--mu)}
.tag.approved,.tag.Fatto{background:var(--ok)}.tag.pending,.tag.Attesa{background:var(--wa)}.tag.rejected{background:var(--er)}.tag.Fare{background:var(--ac)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.md h3{margin:0 0 10px}.f{display:block;margin-bottom:10px}.f span{display:block;font-size:13px;color:var(--mu);margin-bottom:3px}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.ph{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin:6px 0;cursor:pointer}
.sel{margin-bottom:10px;max-width:320px}
.inst{display:flex;gap:8px;align-items:center;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 14px;font-size:14px}.inst span{flex:1}.inst .x{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:4px 8px}.steps{margin:6px 0 0;padding-left:20px}.steps li{margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#111827;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none}
em.modifica{background:var(--wa)!important}em.hol{background:#8a93a6!important}.cell.off>span{opacity:.45}.wkr{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;align-items:center;margin:4px 0}.wkr input,.wkr select{min-width:0;padding:6px 4px}.wkr .tgl{margin:0}.faq{max-height:60vh;overflow:auto}.faq details{border-bottom:1px solid var(--bd);padding:8px 0}.faq summary{cursor:pointer;font-weight:600}.faq p{margin:6px 0 0;color:var(--mu,#667)}.seg{display:flex;gap:6px;overflow-x:auto;margin:8px 0;padding-bottom:2px}.seg .btn{white-space:nowrap}
.tr{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-left:5px solid var(--pc,#4f46e5);border-radius:12px;padding:8px 10px;margin-top:6px;cursor:pointer;background:var(--card)}
.tt{flex:1;min-width:0}.tt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.ins{font-size:11px;opacity:.85}.ttm{font-size:12px;font-weight:700;min-width:44px;color:var(--mu)}
.tr.late{background:#ff6b6b;color:#1a1a1a}.tr.today{background:#ffa94d;color:#1a1a1a}.tr.soon{background:#ffe066;color:#1a1a1a}.tr.week{background:#74c0fc;color:#1a1a1a}.tr.none{background:#ced4da;color:#1a1a1a}.tr.done{background:#69db7c;color:#1a1a1a}
.tr.late .mu,.tr.today .mu,.tr.soon .mu,.tr.week .mu,.tr.none .mu,.tr.done .mu{color:#1a1a1a;opacity:.72}.tr.late,.tr.today,.tr.soon,.tr.week,.tr.none,.tr.done{border-color:rgba(0,0,0,.12)}.tr.sel{outline:3px solid var(--ac);outline-offset:1px}.tr .ck{width:20px;height:20px;flex:none;margin:0}
.tag.tc{color:#1a1a1a;border:1px solid rgba(0,0,0,.15)}.tag.tc.late{background:#ff6b6b}.tag.tc.today{background:#ffa94d}.tag.tc.soon{background:#ffe066}.tag.tc.week{background:#74c0fc}.tag.tc.far{background:var(--bg);color:var(--tx)}.tag.tc.none{background:#ced4da}.tag.tc.done{background:#69db7c}
.selbar{position:fixed;left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:8px 10px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lg summary{cursor:pointer;font-weight:600}.lgi{display:inline-flex;align-items:center;gap:6px;font-size:12px}.lgi i{display:inline-block;width:26px;height:16px;border-radius:5px;margin:0;padding:0;border:1px solid var(--bd);border-left-width:1px}.lgi i.bar{width:5px;height:16px;border:0;border-radius:3px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;border-bottom:1px solid var(--bd)}.dh.on{border-bottom:2px solid var(--ac);color:var(--ac)}
.cw{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px;background:#ffe066;color:#1a1a1a}.cw.bad{background:#ff6b6b}.cw b{display:block}
.pv{position:fixed;z-index:60;width:min(290px,92vw);background:var(--card);color:var(--tx);border:2px solid var(--ac);border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.35);pointer-events:none}.pvr{display:flex;gap:8px;border-left:4px solid var(--pc);padding:2px 0 2px 8px;margin-top:5px;font-size:13px}.pt{font-weight:700;min-width:46px}.pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;overflow:hidden}.mg.sll{animation:sll .22s ease-out}.mg.slr{animation:slr .22s ease-out}@keyframes sll{from{transform:translateX(40px);opacity:.2}}@keyframes slr{from{transform:translateX(-40px);opacity:.2}}
.mc.tr{display:flex;flex-direction:column;align-items:stretch}.mc{min-height:58px;align-items:stretch!important;justify-content:flex-start!important;padding:3px!important;position:relative;cursor:pointer}.mc .dn{display:flex;justify-content:space-between;font-size:12px;font-weight:700}.mc .wr{font-style:normal;font-size:10px}.mc.now .dn span{background:var(--ac);color:#fff;border-radius:99px;min-width:18px;text-align:center;padding:0 3px}.mc.selday{outline:3px solid var(--ac);outline-offset:1px}.mc .chips{display:flex;flex-direction:column;gap:2px;margin-top:2px}.mc .chip{font-size:9px;line-height:12px;border-radius:4px;padding:0 3px;background:var(--pc);color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:700}.mc .more{font-size:9px;font-weight:700;opacity:.8}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.mh{font-size:11px;color:var(--mu);font-weight:600}.mc{display:flex;flex-direction:column;border-radius:9px;font-size:13px;margin:0;min-height:58px;border:1px solid transparent}.mc.tr{border:1px solid rgba(0,0,0,.12);gap:0}
.tgl{display:flex;align-items:center;gap:8px;padding:5px 0;margin:0}.tgl input{width:auto}.perm{margin-top:8px;border-top:1px solid var(--bd);padding-top:6px}input[readonly]{opacity:.7}

.cal.agc{display:block}.chip .ct,.chip.c3,.more.dd{display:none}.tdef{font-size:12px;margin:-4px 0 8px}.tdef a{color:var(--ac);font-weight:600}
.trow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:2px 0 8px}.trow .tgl{padding:0}.tlk{display:flex;align-items:center;gap:10px;font-size:12px}.tlk a:not(.btn){color:var(--ac);font-weight:600}
/* telefono: calendario compatto (puntini) così l'elenco del giorno resta subito visibile sotto */
@media(max-width:699px){.tsplit .mg{gap:3px}.tsplit .mc{min-height:46px;padding:3px 2px!important}.tsplit .mc .dn{justify-content:center;font-size:13px}.tsplit .mc .wr{display:none}
 .tsplit .mc .chips{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px;margin-top:3px}.tsplit .mc .chip{font-size:0;line-height:0;width:7px;height:7px;border-radius:50%;padding:0;border:1px solid rgba(255,255,255,.7)}.tsplit .more.mm{display:none}.tsplit .hint{margin:2px 0 6px!important;font-size:11px}
 .tsplit .tright .card:first-child{margin-top:4px!important}}
/* schermo largo o telefono in orizzontale: calendario a sinistra, elenco a destra */
@media(min-width:700px){.tsplit{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
 .tsplit .tright{position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;padding-right:2px}
 .tsplit .mg{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;align-content:start}.tsplit .mg>div{min-width:0}
 .tsplit .mc{min-height:72px;padding:4px!important}.tsplit .mh{font-size:12px;min-height:0!important;height:auto;padding:3px 0}
 .tsplit .chip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;text-align:left;padding:1px 4px;margin-top:2px}
 .tsplit .chip.c3{display:block}.tsplit .more.mm{display:none}.tsplit .more.dd{display:block}.tsplit .hint{display:none}}
@media(min-width:1000px){main#v.wide{max-width:1480px}.tsplit .chip .ct{display:inline}.tsplit{grid-template-columns:minmax(600px,1.7fr) minmax(380px,1fr);gap:18px}.tsplit .mc{min-height:88px;padding:5px!important;font-size:15px}.tsplit .mh{font-size:13px;padding:4px 0}.tsplit .mg{gap:6px}.tsplit .chip{font-size:11.5px;padding:2px 5px;margin-top:3px}}
</style></head><body>
<header><div class="hl"><img id="logo" alt="" hidden><div><h1>⏱️ Presenze & Ticket Pro</h1><small id="who"></small></div></div><span style="display:flex;gap:8px;align-items:center"><button class="badge" id="bell" onclick="notifPanel()" style="border:0;color:#fff;cursor:pointer;font-size:15px">🔔</button><span class="badge" id="role"></span></span></header>
<div id="inst"></div>
<main id="v"><div class="card mu">Caricamento…</div></main>
<nav id="nav"></nav><div id="toast"></div>
<script src="js/01-collegamento.js"></script><script src="js/02-base.js"></script><script src="js/03-azioni.js"></script><script src="js/04-pdf.js"></script><script src="js/05-viste.js"></script><script src="js/06-ticket.js"></script><script src="js/07-impostazioni.js"></script><script src="js/08-avvio.js"></script></body></html>
